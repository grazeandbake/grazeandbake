<style>
:root{--terra:#A66940;--terra-dark:#6E4227;--cream:#F2E9E1;--cream-warm:#EADFD3;--brand:'Baron',sans-serif;--mono:'Source Code Pro',monospace;--body:'Karla',sans-serif}
@font-face{
  font-family:'Baron';
  font-weight:700;
  font-style:normal;
  font-display:swap;
  src:url('fonts/Baron%20Neue%20Bold.otf') format('opentype');
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--terra);color:var(--cream);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
h1{font-family:var(--brand);font-weight:700;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.1em;line-height:1.1}
.co{font-family:var(--mono);font-weight:300;font-size:.75rem;letter-spacing:.55em;margin-top:.7rem;color:var(--cream-warm);text-indent:.55em}
.rule{width:56px;height:2px;background:var(--cream);opacity:.6;margin:2rem 0 1.6rem}
p{max-width:32rem;font-weight:300;color:var(--cream-warm);line-height:1.7}
p strong{color:var(--cream);font-weight:600}
a.back{font-family:var(--mono);font-weight:600;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;background:var(--cream);color:var(--terra-dark);padding:1rem 2.2rem;border-radius:2px;margin-top:2.2rem;display:inline-block}
a.back:hover{background:#fff}
</style>
